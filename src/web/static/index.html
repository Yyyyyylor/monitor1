<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://steamcommunity-a.akamaihd.net">
<title>Steam CS2 库存监控器</title>
<style>
:root {
  --bg: #0f1117; --card: #1a1d27; --border: #2a2d3a; --accent: #6c5ce7;
  --accent2: #00cec9; --green: #00b894; --red: #d63031; --orange: #fdcb6e;
  --text: #dfe6e9; --text2: #b2bec3; --text3: #636e72;
  --fn: #4b69ff; --mw: #5e98d9; --ft: #4b69ff; --ww: #b45309; --bs: #8847ff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header h1 { font-size: 20px; display: flex; align-items: center; gap: 10px; }
.header-right { display: flex; align-items: center; gap: 12px; }
.status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.status-dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }
.status-dot.off { background: var(--red); }
.status-text { font-size: 13px; color: var(--text2); }

.btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all .2s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #5b4bd5; }
.btn-success { background: var(--green); color: #fff; }
.btn-danger { background: var(--red); color: #fff; }
.btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn-sm { padding: 5px 10px; font-size: 12px; }

.main { display: flex; height: calc(100vh - 57px); }
.sidebar { width: 300px; background: var(--card); border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; }
.content { flex: 1; overflow-y: auto; padding: 24px; }

.sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.sidebar-header h3 { font-size: 14px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; }
.user-card { padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .15s; display: flex; align-items: center; gap: 12px; }
.user-card:hover { background: rgba(108,92,231,0.08); }
.user-card.active { background: rgba(108,92,231,0.15); border-left: 3px solid var(--accent); }
.user-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.user-info { flex: 1; min-width: 0; }
.user-name { font-weight: 600; font-size: 15px; }
.user-meta { font-size: 12px; color: var(--text3); display: flex; gap: 8px; margin-top: 2px; }
.badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.badge-ok { background: rgba(0,184,148,0.15); color: var(--green); }
.badge-fail { background: rgba(214,48,49,0.15); color: var(--red); }
.badge-off { background: rgba(99,110,114,0.2); color: var(--text3); }

.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 20px; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
.stat-card .label { font-size: 12px; color: var(--text3); text-transform: uppercase; }
.stat-card .value { font-size: 28px; font-weight: 700; margin-top: 4px; }
.stat-card .sub { font-size: 12px; color: var(--text2); margin-top: 2px; }

/* Category tabs */
.cat-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.cat-tab { padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--text2); transition: all .15s; }
.cat-tab:hover { border-color: var(--accent); color: var(--accent); }
.cat-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.cat-tab .cnt { opacity: 0.7; margin-left: 4px; }

/* Sort/filter bar */
.filter-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.filter-bar select { padding: 6px 10px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; }
.filter-bar input { padding: 6px 10px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; width: 200px; }

/* Item grid */
.item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.item-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; cursor: pointer; transition: all .2s; position: relative; }
.item-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); border-color: var(--accent); }
.item-wear-bar { height: 3px; width: 100%; }
.item-img-box { height: 100px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.2); padding: 8px; }
.item-img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
.item-info { padding: 8px 10px; }
.item-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
.item-wear-text { font-size: 11px; color: var(--text3); }
.item-rarity { font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: 600; }
.item-st-badge { position: absolute; top: 6px; right: 6px; background: #e74c3c; color: #fff; font-size: 9px; font-weight: 700; padding: 2px 4px; border-radius: 3px; }
.item-count-badge { position: absolute; top: 6px; left: 6px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 3px; }

/* Detail modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: flex; align-items: center; justify-content: center; }
.modal-detail { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 560px; max-width: 95vw; max-height: 85vh; overflow-y: auto; }
.modal-detail-header { padding: 20px; display: flex; gap: 16px; border-bottom: 1px solid var(--border); }
.modal-detail-img { width: 140px; height: 140px; background: rgba(0,0,0,0.3); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.modal-detail-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
.modal-detail-title { flex: 1; }
.modal-detail-title h2 { font-size: 18px; margin-bottom: 8px; }
.modal-detail-title .meta-row { font-size: 13px; color: var(--text2); margin-bottom: 4px; }
.modal-detail-body { padding: 20px; }
.modal-detail-body .sticker-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.modal-detail-body .sticker-item { background: var(--bg); padding: 8px; border-radius: 8px; font-size: 12px; }
.modal-actions { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }
.close-btn { position: absolute; top: 12px; right: 16px; background: none; border: none; color: var(--text3); font-size: 24px; cursor: pointer; }

/* Tabs */
.tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.tab { padding: 10px 20px; font-size: 13px; cursor: pointer; color: var(--text3); border-bottom: 2px solid transparent; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; }
.panel-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.panel-body { padding: 20px; }

.inv-table { width: 100%; border-collapse: collapse; }
.inv-table th { text-align: left; padding: 10px 12px; font-size: 12px; color: var(--text3); border-bottom: 1px solid var(--border); }
.inv-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
.inv-table tr:hover { background: rgba(108,92,231,0.05); }

.change-item { padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.change-badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; min-width: 70px; text-align: center; }
.change-badge.added { background: rgba(0,184,148,0.15); color: var(--green); }
.change-badge.removed { background: rgba(214,48,49,0.15); color: var(--red); }
.change-badge.modified { background: rgba(253,203,110,0.15); color: var(--orange); }
.change-badge.swapped { background: rgba(108,92,231,0.15); color: var(--accent); }
.change-detail { font-size: 13px; color: var(--text2); }
.change-time { font-size: 11px; color: var(--text3); margin-left: auto; }

.empty { text-align: center; padding: 60px 20px; color: var(--text3); }
.empty .icon { font-size: 48px; margin-bottom: 12px; }
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 20px; font-size: 13px; z-index: 300; animation: slideUp .3s; }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
@media (max-width: 768px) { .main { flex-direction: column; } .sidebar { width: 100%; max-height: 40vh; } .stats-row { grid-template-columns: 1fr 1fr; } .item-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); } }

/* 频率标签 */
.freq-badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.freq-high { background: rgba(214,48,49,0.15); color: var(--red); }
.freq-medium { background: rgba(253,203,110,0.15); color: var(--orange); }
.freq-low { background: rgba(99,110,114,0.2); color: var(--text3); }
.freq-select { padding: 2px 4px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 11px; cursor: pointer; transition: border-color .15s; width: 100%; }
.freq-select:hover { border-color: var(--accent); }
/* 频率管理面板 */
.freq-panel { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-top: 12px; }
.freq-panel h3 { font-size: 13px; color: var(--text2); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
.freq-tier-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 12px; }
.freq-tier-row:last-child { border-bottom: none; }
.freq-tier-name { width: 60px; font-weight: 600; }
.freq-tier-count { width: 40px; color: var(--text2); }
.freq-tier-last { flex: 1; color: var(--text3); font-size: 11px; }

/* v2.4 visual system: compact cyber-operations workspace, built without external assets. */
:root {
  --bg: #080d12;
  --card: #101923;
  --card-strong: #14202c;
  --border: rgba(163, 205, 218, .14);
  --accent: #2bc5a8;
  --accent2: #71d4e7;
  --green: #48d17e;
  --red: #ff6b70;
  --orange: #f8bf67;
  --text: #eef7f7;
  --text2: #b5c7ca;
  --text3: #789095;
}
body {
  font-family: Bahnschrift, "Microsoft YaHei UI", "Segoe UI", sans-serif;
  letter-spacing: .01em;
  background:
    radial-gradient(circle at 88% -18%, rgba(43, 197, 168, .17), transparent 36rem),
    radial-gradient(circle at -10% 80%, rgba(77, 136, 173, .14), transparent 34rem),
    var(--bg);
}
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .22; background-image: linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px); background-size: 36px 36px; mask-image: linear-gradient(to bottom, #000, transparent 80%); }
.header { min-height: 70px; padding: 12px clamp(16px, 3vw, 40px); background: rgba(8, 13, 18, .86); backdrop-filter: blur(20px); border-bottom-color: rgba(163,205,218,.12); box-shadow: 0 10px 35px rgba(0,0,0,.12); }
.header h1 { font-size: clamp(16px, 2vw, 21px); font-weight: 750; letter-spacing: .025em; }
.header h1::first-letter { color: var(--accent); }
.app-brand { display: grid; gap: 2px; }
.app-brand::after { content: "INVENTORY INTELLIGENCE"; color: var(--text3); font-size: 9px; font-weight: 700; letter-spacing: .19em; padding-left: 32px; }
.header-right { gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.status-dot { width: 8px; height: 8px; margin-left: 4px; }
.status-dot.on { box-shadow: 0 0 0 5px rgba(72,209,126,.10), 0 0 14px var(--green); }
.status-text { padding-right: 8px; font-size: 12px; }
.btn { min-height: 32px; padding: 7px 13px; border: 1px solid transparent; border-radius: 9px; font-family: inherit; letter-spacing: .015em; box-shadow: 0 1px 0 rgba(255,255,255,.04) inset; }
.btn-primary { background: linear-gradient(135deg, #27b99f, #15967f); box-shadow: 0 8px 18px rgba(21,150,127,.18); }
.btn-primary:hover { background: linear-gradient(135deg, #3bd1b4, #1fa890); transform: translateY(-1px); }
.btn-success { background: linear-gradient(135deg, #35be6a, #279855); }
.btn-ghost { background: rgba(255,255,255,.025); border-color: var(--border); }
.main { height: calc(100vh - 70px); }
.sidebar { width: clamp(272px, 23vw, 330px); background: rgba(13, 22, 31, .76); backdrop-filter: blur(12px); }
.sidebar-header { padding: 20px 18px 14px; }
.sidebar-header h3, .freq-panel h3 { color: var(--text3); font-size: 10px; letter-spacing: .18em; }
.content { padding: clamp(18px, 2.5vw, 34px); scroll-behavior: smooth; }
.user-card { position: relative; margin: 5px 9px; padding: 12px; border: 1px solid transparent; border-radius: 12px; }
.user-card:hover { background: rgba(113,212,231,.06); border-color: rgba(113,212,231,.13); transform: translateX(2px); }
.user-card.active { background: linear-gradient(100deg, rgba(43,197,168,.17), rgba(113,212,231,.055)); border: 1px solid rgba(43,197,168,.23); border-left: 3px solid var(--accent); }
.user-avatar { background: linear-gradient(145deg, #1a2b38, #0f1720); border: 1px solid rgba(113,212,231,.13); }
.user-name { letter-spacing: .02em; }
.user-name { display: flex !important; align-items: center !important; gap: 8px !important; min-width: 0; width: 100%; }
.user-name-text { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-badges { display: flex; flex: 0 0 auto; align-items: center; gap: 6px; white-space: nowrap; }
.user-badges .badge, .user-badges .freq-badge { white-space: nowrap; }
.user-meta { gap: 10px; margin-top: 5px; }
.stats-row { gap: 13px; margin-bottom: 25px; }
.stat-card { position: relative; overflow: hidden; min-height: 108px; padding: 19px; border-radius: 15px; background: linear-gradient(145deg, rgba(23,35,47,.92), rgba(13,22,31,.92)); box-shadow: 0 14px 30px rgba(0,0,0,.11); }
.stat-card::after { content: ""; position: absolute; right: -18px; bottom: -24px; width: 82px; height: 82px; border: 1px solid rgba(113,212,231,.15); border-radius: 50%; }
.stat-card .label { letter-spacing: .12em; font-size: 10px; }
.stat-card .value { font-size: clamp(25px, 3vw, 34px); font-variant-numeric: tabular-nums; }
.cat-tabs { gap: 8px; margin-bottom: 18px; }
.cat-tab { padding: 7px 13px; border-radius: 999px; background: rgba(16,25,35,.72); }
.cat-tab.active { background: rgba(43,197,168,.17); color: #b9f8ea; border-color: rgba(43,197,168,.38); }
.filter-bar { position: sticky; top: -20px; z-index: 5; padding: 11px 0; margin-bottom: 12px; background: linear-gradient(to bottom, var(--bg) 72%, transparent); }
.filter-bar input, .filter-bar select, input, textarea { border-color: var(--border); background: rgba(6,13,19,.72); border-radius: 9px; font-family: inherit; }
.filter-bar input { min-width: min(100%, 240px); flex: 1; }
.item-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
.item-card { border-radius: 14px; border-color: rgba(163,205,218,.12); background: linear-gradient(150deg, rgba(22,33,45,.96), rgba(12,20,29,.96)); box-shadow: 0 8px 22px rgba(0,0,0,.13); animation: card-enter .38s both; animation-delay: min(calc(var(--item-index, 0) * 28ms), 280ms); }
.item-card:hover { transform: translateY(-5px); box-shadow: 0 16px 34px rgba(0,0,0,.25), 0 0 0 1px rgba(43,197,168,.35); border-color: rgba(43,197,168,.45); }
.item-wear-bar { height: 4px; }
.item-img-box { height: 132px; position: relative; padding: 12px; background: radial-gradient(circle at 50% 38%, rgba(113,212,231,.12), transparent 62%), rgba(3,8,13,.48); }
.item-img-box::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.07) 50%, transparent 62%); transform: translateX(-100%); animation: image-sheen 1.3s ease-in-out infinite; }
.item-img-box:has(img.is-loaded)::after, .item-img-box:has(img.is-failed)::after { display: none; }
.item-img-box img { position: relative; z-index: 1; opacity: 0; transform: scale(.96); transition: opacity .24s ease, transform .3s cubic-bezier(.2,.8,.2,1); }
.item-img-box img.is-loaded { opacity: 1; transform: scale(1); }
.item-img-box img.is-failed { opacity: .35; }
.item-info { padding: 11px 12px 12px; }
.item-name { line-height: 1.35; font-size: 12px; }
.item-bottom { gap: 7px; margin-top: 7px; }
.item-rarity { overflow: hidden; max-width: 56%; text-overflow: ellipsis; white-space: nowrap; padding: 3px 6px; border-radius: 5px; }
.item-st-badge, .item-count-badge { top: 9px; padding: 3px 6px; border-radius: 6px; backdrop-filter: blur(8px); }
.panel { border-radius: 15px; background: linear-gradient(145deg, rgba(17,27,38,.92), rgba(12,20,29,.92)); box-shadow: 0 12px 32px rgba(0,0,0,.11); }
.panel-header { padding: 16px 20px; }
.panel-header h2 { font-size: 15px; letter-spacing: .03em; }
.panel-body { padding: 20px; }
.tabs { gap: 5px; padding: 8px 12px 0; }
.tab { border-radius: 8px 8px 0 0; padding: 10px 14px; }
.tab.active { background: rgba(43,197,168,.07); color: #b9f8ea; }
.change-item { gap: 12px; padding: 11px 0; }
.change-time { font-variant-numeric: tabular-nums; }
.modal-overlay { padding: 18px; background: rgba(3,8,13,.76); backdrop-filter: blur(8px); animation: overlay-enter .18s ease; }
.modal-overlay > div:not(.modal-detail), .modal-detail { background: linear-gradient(145deg, #172431, #0e1721) !important; border-color: rgba(163,205,218,.18) !important; box-shadow: 0 28px 75px rgba(0,0,0,.44); animation: modal-enter .26s cubic-bezier(.2,.85,.25,1); }
.empty { padding: min(20vh, 150px) 20px; }
.empty .icon { filter: drop-shadow(0 10px 18px rgba(43,197,168,.22)); }
.toast { border-color: rgba(43,197,168,.3); background: rgba(17,28,38,.94); backdrop-filter: blur(12px); box-shadow: 0 14px 36px rgba(0,0,0,.26); }
.manage-table-wrap { overflow-x: auto; overscroll-behavior-inline: contain; }
.manage-table { table-layout: fixed; min-width: 650px; }
.manage-table th, .manage-table td { padding-inline: 8px; }
.manage-action-cell { padding-inline: 6px !important; }
.manage-action-buttons { display: flex; align-items: center; gap: 6px; min-width: 132px; }
.manage-action-buttons .btn { width: 40px; height: 40px; min-height: 40px; flex: 0 0 40px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
@keyframes card-enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes image-sheen { 55%, 100% { transform: translateX(100%); } }
@keyframes overlay-enter { from { opacity: 0; } to { opacity: 1; } }
@keyframes modal-enter { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } }
@media (max-width: 768px) { .header { align-items: flex-start; gap: 10px; flex-direction: column; } .header-right { width: 100%; justify-content: flex-start; } .main { height: auto; min-height: calc(100vh - 130px); } .sidebar { width: 100%; max-height: 250px; } .content { min-height: 60vh; } .filter-bar { top: 0; } .item-grid { grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 10px; } .item-img-box { height: 116px; } }
</style>
</head>
<body>

<div class="header">
  <div class="app-brand">
  <h1>🎯 Steam CS2 库存监控器</h1>
  </div>
  <div class="header-right">
    <span class="status-dot" id="statusDot"></span>
    <span class="status-text" id="statusText">检查中...</span>

<script>
const API = '';
let currentSteamId = null, editingSteamId = null, pollTimer = null, heartbeatTimer = null, wsConn = null;
let currentInventory = null, activeCategory = 'all', displayMode = 'stacked';
let wsReconnectTimer = null, liveUpdatesActive = false;
let refreshStatusInFlight = null, refreshStatusQueued = false;
let loadUsersInFlight = null, loadUsersQueued = false;
let viewRequestVersion = 0, viewAbortController = null;

// Steam CDN images are network-bound.  Keep a small, predictable request queue so
// the first visible cards load first without starting hundreds of image fetches at once.
const INVENTORY_IMAGE_CONCURRENCY = 6;
const INVENTORY_EAGER_IMAGE_COUNT = 12;
let inventoryImageQueue = [];
let inventoryImageLoads = 0;
let inventoryImageObserver = null;
let inventoryImageGeneration = 0;
let inventoryImageActive = new Set();
let searchDebounceTimer = null;

// --- HTML / 属性安全转义（防 XSS） ---
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// 将对象序列化为可安全嵌入 HTML 属性的 JSON：属性解析后再被 JS 读取时还原为原始值
function jsonAttr(obj) {
  return JSON.stringify(obj).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// --- Wear colors ---
const CHANGETYPE_ZH = {added:'新增', removed:'移除', modified:'修改', swapped:'交换'};
const WEAR_COLORS = { 'Factory New': '#4b69ff', 'Minimal Wear': '#5e98d9', 'Field-Tested': '#b0a132', 'Well-Worn': '#b45309', 'Battle-Scarred': '#8847ff' };
const RARITY_COLORS = { 'Consumer Grade': '#b0c3d9', 'Industrial Grade': '#5e98d9', 'Mil-Spec Grade': '#4b69ff', 'Restricted': '#8847ff', 'Classified': '#d32ce6', 'Covert': '#eb4b4b', '★': '#e4ae39', 'Exceedingly Rare': '#e4ae39' };

function getWearColor(name) { for (const [k, v] of Object.entries(WEAR_COLORS)) { if (name && name.includes(k)) return v; } return '#636e72'; }
function getRarityColor(name) { if (!name) return '#b0c3d9'; for (const [k, v] of Object.entries(RARITY_COLORS)) { if (name.includes(k)) return v; } return '#b0c3d9'; }
function imgUrl(icon) { return icon ? `https://steamcommunity-a.akamaihd.net/economy/image/${icon}/120x120` : ''; }

function queueInventoryImage(img, priority = false) {
  if (!img || !img.dataset.src || img.dataset.imageState) return;
  img.dataset.imageState = 'queued';
  if (priority) inventoryImageQueue.unshift(img); else inventoryImageQueue.push(img);
  drainInventoryImageQueue();
}

function drainInventoryImageQueue() {
  const maxConcurrentLoads = window.matchMedia('(max-width: 768px)').matches ? 4 : INVENTORY_IMAGE_CONCURRENCY;
  while (inventoryImageLoads < maxConcurrentLoads && inventoryImageQueue.length) {
    const img = inventoryImageQueue.shift();
    if (!img?.isConnected || img.dataset.imageState !== 'queued') continue;
    inventoryImageLoads += 1;
    img.dataset.imageState = 'loading';
    const loadGeneration = inventoryImageGeneration;
    inventoryImageActive.add(img);
    const finish = async (loaded) => {
      if (loadGeneration !== inventoryImageGeneration) return;
      inventoryImageActive.delete(img);
      if (loaded && typeof img.decode === 'function') {
        try { await img.decode(); } catch (_) { /* image was already rendered or cannot be decoded */ }
      }
      img.classList.add(loaded ? 'is-loaded' : 'is-failed');
      inventoryImageLoads -= 1;
      drainInventoryImageQueue();
    };
    img.addEventListener('load', () => finish(true), { once: true });
    img.addEventListener('error', () => finish(false), { once: true });
    img.src = img.dataset.src;
  }
}

function prepareInventoryImageLoading() {
  inventoryImageObserver?.disconnect();
  inventoryImageGeneration += 1;
  for (const img of inventoryImageActive) img.removeAttribute('src');
  inventoryImageActive.clear();
  inventoryImageLoads = 0;
  inventoryImageQueue = [];
  const images = [...document.querySelectorAll('#itemGrid img[data-src]')].filter(img => {
    if (img.dataset.src) return true;
    img.classList.add('is-failed');
    return false;
  });
  if (!images.length) return;
  images.slice(0, 6).forEach(img => {
    img.setAttribute('fetchpriority', 'high');
    queueInventoryImage(img, true);
  });
  images.slice(6, INVENTORY_EAGER_IMAGE_COUNT).forEach(img => {
    img.setAttribute('fetchpriority', 'auto');
    queueInventoryImage(img, true);
  });
  inventoryImageObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      queueInventoryImage(entry.target);
      inventoryImageObserver.unobserve(entry.target);
    }
  }, { root: document.getElementById('content'), rootMargin: '720px 0px' });
  images.slice(INVENTORY_EAGER_IMAGE_COUNT).forEach(img => inventoryImageObserver.observe(img));
}

// --- API (带认证) ---
class ApiError extends Error {
  constructor(message, status = 0) { super(message); this.name = 'ApiError'; this.status = status; }
}

async function api(method, path, body, requestOptions = {}) {
  const opts = { method, headers: { 'Content-Type': 'application/json' }, signal: requestOptions.signal };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  const responseText = await r.text();
  if (r.status === 401) { showLogin(); throw new ApiError('unauthorized', 401); }
  let data = null;
  if (responseText) {
    try { data = JSON.parse(responseText); }
    catch { throw new ApiError(`服务器返回了无法识别的响应（HTTP ${r.status}）`, r.status); }
  }
  if (!r.ok) throw new ApiError(data?.error || `请求失败（HTTP ${r.status}）`, r.status);
  if (data === null) throw new ApiError('服务器返回了空响应', r.status);
  return data;
}
function toast(msg) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 3000); }

function isAbortError(error) { return error?.name === 'AbortError'; }
function beginViewRequest() {
  viewRequestVersion += 1;
  viewAbortController?.abort();
  viewAbortController = new AbortController();
  return { version: viewRequestVersion, controller: viewAbortController };
}
function isCurrentView(request) {
  return request.version === viewRequestVersion && !request.controller.signal.aborted;
}
function showViewError(container, error, retryAction) {
  const message = error?.message && error.message !== 'unauthorized' ? error.message : '加载失败，请检查网络后重试';
  container.innerHTML = `<div class="empty"><div class="icon">⚠️</div><p>${esc(message)}</p><button class="btn btn-primary" onclick="${retryAction}">重试</button></div>`;
}

// --- Login ---
async function doLogin() {
  const pw = document.getElementById('loginPassword').value;
  if (!pw) return;
  try {
    const r = await fetch(API + '/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({password: pw}) });
    const d = await r.json();
    if (d.ok) {
      document.getElementById('loginOverlay').style.display = 'none';
      await init();
    } else {
      document.getElementById('loginError').textContent = d.error || '密码错误';
      document.getElementById('loginError').style.display = '';
    }
  } catch(e) { document.getElementById('loginError').textContent = '连接失败'; document.getElementById('loginError').style.display = ''; }
}
function showLogin() {
  document.getElementById('loginOverlay').style.display = '';
  stopLiveUpdates();
}
async function checkAuth() {
  try { const r = await fetch(API + '/api/users'); return r.status !== 401; } catch { return false; }
}

// --- WebSocket ---
function connectWS() {
  if (!liveUpdatesActive) return;
  if (wsConn && (wsConn.readyState === WebSocket.OPEN || wsConn.readyState === WebSocket.CONNECTING)) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  wsConn = new WebSocket(`${proto}//${location.host}/api/ws`);
  wsConn.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'user_done') {
        // 逐用户实时提示
        const d = msg.data;
        const icon = d.ok ? '✅' : '❌';
        const detail = d.ok ? (d.events > 0 ? `· ${d.events}个变化` : '· 无变化') : `· ${d.msg}`;
        toast(`${icon} ${d.nickname || d.steam_id} ${detail}`);
        loadUsers().catch(() => {});
        if (currentSteamId === d.steam_id) loadInventory(d.steam_id).catch(() => {});
      }
      if (msg.type === 'update') {
        refreshStatus().catch(() => {});
        loadUsers().catch(() => {});
      }
    } catch {}
  };
  wsConn.onclose = () => {
    wsConn = null;
    if (!liveUpdatesActive || wsReconnectTimer) return;
    wsReconnectTimer = setTimeout(() => { wsReconnectTimer = null; connectWS(); }, 5000);
  };
}

// --- Heartbeat ---
function startHeartbeat() { if (heartbeatTimer) return; heartbeatTimer = setInterval(() => fetch(API+'/api/heartbeat',{method:'POST'}).catch(()=>{}), 5000); }
function stopLiveUpdates() {
  liveUpdatesActive = false;
  if (pollTimer) clearInterval(pollTimer);
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
  pollTimer = null; heartbeatTimer = null; wsReconnectTimer = null;
  if (wsConn) { wsConn.onclose = null; wsConn.close(); wsConn = null; }
}
function startLiveUpdates() {
  liveUpdatesActive = true;
  startHeartbeat();
  connectWS();
  if (!pollTimer) pollTimer = setInterval(() => {
    refreshStatus().catch(() => {});
    loadUsers().catch(() => {});
  }, 30000);
}
window.addEventListener('beforeunload', () => navigator.sendBeacon(API + '/api/heartbeat'));

// --- Status ---
async function refreshStatus() {
  if (refreshStatusInFlight) { refreshStatusQueued = true; return refreshStatusInFlight; }
  refreshStatusInFlight = (async () => {
    let status;
    do {
      refreshStatusQueued = false;
      status = await api('GET', '/api/status');
      const dot = document.getElementById('statusDot'), txt = document.getElementById('statusText'), btn = document.getElementById('btnToggleMonitor');
      if (status.monitor_running) { dot.className='status-dot on'; txt.textContent=`运行中 · ${status.last_run_time?'上次: '+new Date(status.last_run_time).toLocaleTimeString():'等待首次运行'}`; btn.textContent='停止监控'; btn.className='btn btn-sm btn-danger'; }
      else { dot.className='status-dot off'; txt.textContent='已停止'; btn.textContent='启动监控'; btn.className='btn btn-sm btn-success'; }
    } while (refreshStatusQueued);
    return status;
  })();
  try { return await refreshStatusInFlight; }
  finally { refreshStatusInFlight = null; }
}

// --- Users ---
async function loadUsers() {
  if (loadUsersInFlight) { loadUsersQueued = true; return loadUsersInFlight; }
  loadUsersInFlight = (async () => {
    do {
      loadUsersQueued = false;
      const users = await api('GET', '/api/users');
      const box = document.getElementById('userList');
      if (!users.length) { box.innerHTML = '<div class="empty" style="padding:40px"><div class="icon">👋</div><p style="margin:8px 0">欢迎使用！</p><p style="font-size:12px;color:var(--text3);margin-bottom:12px">请先添加要监控的 Steam 用户</p><button class="btn btn-primary" onclick="showAddModal()">+ 添加第一个用户</button></div>'; continue; }
      box.innerHTML = users.map(u => {
    const active = u.steam_id === currentSteamId ? ' active' : '';
    const badge = u.is_active
      ? (u.consecutive_fails > 0 ? `<span class="badge badge-fail">失败×${u.consecutive_fails}</span>`
        : (u.item_count > 0 ? `<span class="badge badge-ok">正常</span>` : `<span class="badge" style="background:rgba(253,203,110,0.15);color:var(--orange)">待抓取</span>`))
      : '<span class="badge badge-off">停用</span>';
    const freqBadge = `<span class="freq-badge freq-${u.monitor_frequency||'medium'}">${({'high':'⚡高','medium':'🕐中','low':'💤低'})[u.monitor_frequency||'medium']}</span>`;
    return `<div class="user-card${active}" onclick="selectUser(${jsonAttr(u.steam_id)})">
      <div class="user-avatar">👤</div>
      <div class="user-info">
        <div class="user-name"><span class="user-name-text">${esc(u.nickname||u.steam_id)}</span><span class="user-badges">${badge}${freqBadge}</span></div>
        <div class="user-meta"><span>📦 ${u.item_count}件</span><span>Σ ${u.api_total_count}</span></div>
      </div></div>`;
      }).join('');
    } while (loadUsersQueued);
  })();
  try { return await loadUsersInFlight; }
  finally { loadUsersInFlight = null; }
}

// --- Select user & load inventory ---
async function selectUser(sid) {
  currentSteamId = sid; activeCategory = 'all';
  await Promise.all([loadUsers(), loadInventory(sid)]);
}

function renderChangesHtml(changes) {
  const CHANGE_LIMIT = 10;
  const changeHtml = changes.length===0 ? '<div style="color:var(--text3);text-align:center">暂无变化</div>' :
    changes.map((c, i) => {
      const hidden = i >= CHANGE_LIMIT ? ' style="display:none"' : '';
      const cls = i >= CHANGE_LIMIT ? 'change-item change-extra' : 'change-item';
      const changeName = c.name_zh||c.detail?.market_hash_name||c.detail?.item?.market_hash_name||c.detail?.current_state?.market_hash_name||'?';
      return `<div class="${cls}"${hidden}><span class="change-badge ${c.change_type}">${CHANGETYPE_ZH[c.change_type]||c.change_type}</span><span class="change-detail">${esc(changeName)}</span><span class="change-time">${c.change_time?new Date(c.change_time).toLocaleString():''}</span></div>`;
    }).join('');
  const expandBtn = changes.length > CHANGE_LIMIT
    ? `<div id="changeExpand" style="text-align:center;padding:12px 0"><button class="btn btn-sm btn-ghost" onclick="toggleChanges()">展开全部 (${changes.length} 条)</button></div>`
    : '';
  return changeHtml + expandBtn;
}

async function loadInventory(sid) {
  const c = document.getElementById('content');
  const request = beginViewRequest();
  c.innerHTML = '<div style="padding:40px;text-align:center"><div class="spinner"></div></div>';
  const changesPromise = api('GET', `/api/users/${sid}/changes?limit=500`, undefined, { signal: request.controller.signal });
  // Attach a rejection handler before awaiting the inventory so a fast history
  // failure cannot surface as an unhandled rejection while inventory is loading.
  const changesResultPromise = changesPromise.then(
    changes => ({ changes }),
    error => ({ error }),
  );
  let inv;
  try {
    inv = await api('GET', `/api/users/${sid}/inventory`, undefined, { signal: request.controller.signal });
  } catch (error) {
    if (!isAbortError(error) && isCurrentView(request)) {
      if (error instanceof ApiError && error.status === 404) {
        c.innerHTML = '<div class="empty"><div class="icon">📭</div><p>暂无数据</p></div>';
      } else {
        showViewError(c, error, `loadInventory(${jsonAttr(sid)})`);
      }
    }
    return;
  }
  if (!isCurrentView(request)) return;
  if (inv.error) { c.innerHTML = '<div class="empty"><div class="icon">📭</div><p>暂无数据</p></div>'; return; }
  currentInventory = inv;

  // Categorize items
  const categories = {};
  inv.items.forEach(item => {
    const type = (item.tags||[]).find(t=>t.category==='Type')?.localized_tag_name || item.type_line || '其他';
    if (!categories[type]) categories[type] = [];
    categories[type].push(item);
  });

  const diff = inv.api_total_count - inv.item_count;
  const catEntries = Object.entries(categories).sort((a,b)=>b[1].length-a[1].length);

  // Build HTML
  let html = `<div class="stats-row">
    <div class="stat-card"><div class="label">API 返回</div><div class="value">${inv.item_count}</div></div>
    <div class="stat-card"><div class="label">Steam 总数</div><div class="value">${inv.api_total_count}</div></div>
    <div class="stat-card"><div class="label">存储单元估算</div><div class="value">${diff}</div></div>
    <div class="stat-card"><div class="label">物品种类</div><div class="value">${inv.summary.length}</div></div>
  </div>`;

  // Category tabs
  html += `<div class="cat-tabs"><div class="cat-tab active" onclick="filterCat('all',this)">全部 <span class="cnt">(${inv.items.length})</span></div>`;
  catEntries.forEach(([cat, items]) => {
    html += `<div class="cat-tab" data-cat="${esc(cat)}" onclick="filterCat(this.dataset.cat,this)">${esc(cat)} <span class="cnt">(${items.length})</span></div>`;
  });
  html += `</div>`;

  // Filter bar
  html += `<div class="filter-bar">
    <div style="display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden">
      <button class="btn btn-sm" id="btnStacked" onclick="setDisplayMode('stacked')" style="border-radius:0;${displayMode==='stacked'?'background:var(--accent);color:#fff':''}">☷ 堆叠</button>
      <button class="btn btn-sm" id="btnSplit" onclick="setDisplayMode('split')" style="border-radius:0;border-left:1px solid var(--border);${displayMode==='split'?'background:var(--accent);color:#fff':''}">☐ 拆分</button>
    </div>
    <select id="sortSelect" onchange="applySort()"><option value="default">默认排序</option><option value="name-asc">名称 A→Z</option><option value="name-desc">名称 Z→A</option><option value="wear-asc">磨损低→高</option><option value="wear-desc">磨损高→低</option><option value="count-desc">数量多→少</option></select>
    <input type="text" id="searchInput" placeholder="搜索物品名称..." oninput="applySearch()">
  </div>`;

  // Item grid
  html += `<div class="item-grid" id="itemGrid"></div>`;

  // Changes are independent of the inventory. Render the inventory first and fill this
  // panel when the history request completes so a slow history response cannot delay it.
  html += `<div class="panel" style="margin-top:20px"><div class="tabs">
    <div class="tab active" onclick="switchTab(this,'changesTab')">📜 变化记录</div>
    <div class="tab" onclick="switchTab(this,'archiveTab')">📅 历史快照</div>
  </div>
  <div id="changesTab" class="panel-body">

// --- Display mode ---

// --- Group items by market_hash_name ---
function groupByName(items) {
  const groups = {};
  items.forEach(item => {
    const key = item.market_hash_name || 'Unknown';
    if (!groups[key]) groups[key] = { representative: item, items: [] };
    groups[key].items.push(item);
  });
  return Object.values(groups).sort((a, b) => b.items.length - a.items.length);
}

function renderItemCard(item, count) {
  const wearName = (item.tags||[]).find(t=>t.category==='Exterior')?.localized_tag_name || '';
  const wearColor = getWearColor(wearName);
  const rarityName = item.rarity || '';
  const rarityColor = getRarityColor(rarityName);
  const isST = (item.tags||[]).some(t=>t.category==='Quality'&&t.internal_name==='strange') || item.market_hash_name?.includes('StatTrak');
  const wearVal = item.attributes?.paint_wear;
  const wearStr = wearVal ? wearVal.toFixed(4) : wearName;
  const displayName = item.name_zh || item.market_hash_name;
  return `<div class="item-card" onclick='showDetail(${jsonAttr(item)})'>
    <div class="item-wear-bar" style="background:${wearColor}"></div>

// --- Category filter ---
function filterCat(cat, el) {
  activeCategory = cat;
  document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderFilteredItems();
}

function applySort() { renderFilteredItems(); }
function applySearch() {
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(renderFilteredItems, 180);
}

function renderFilteredItems() {
  if (!currentInventory) return;
  let items = activeCategory === 'all' ? [...currentInventory.items] : currentInventory.items.filter(i => {
    const type = (i.tags||[]).find(t=>t.category==='Type')?.localized_tag_name || i.type_line || '其他';
    return type === activeCategory;
  });
  const search = document.getElementById('searchInput')?.value?.toLowerCase() || '';
  if (search) items = items.filter(i =>
    i.market_hash_name?.toLowerCase().includes(search) ||
    (i.name_zh && i.name_zh.toLowerCase().includes(search))
  );
  const sort = document.getElementById('sortSelect')?.value || 'default';

  if (displayMode === 'stacked') {
    // Stacked: group by name, render one card per group
    let groups = groupByName(items);
    if (sort === 'name-asc') groups.sort((a,b)=>(a.representative.market_hash_name||'').localeCompare(b.representative.market_hash_name||''));
    if (sort === 'name-desc') groups.sort((a,b)=>(b.representative.market_hash_name||'').localeCompare(a.representative.market_hash_name||''));
    if (sort === 'count-desc') groups.sort((a,b)=>b.items.length-a.items.length);
    document.getElementById('itemGrid').innerHTML = groups.map(g =>
      renderStackedCard(g.representative, g.items)
    ).join('');
  } else {
    // Split: render each individual item
    if (sort === 'name-asc') items.sort((a,b)=>(a.market_hash_name||'').localeCompare(b.market_hash_name||''));
    if (sort === 'name-desc') items.sort((a,b)=>(b.market_hash_name||'').localeCompare(a.market_hash_name||''));
    if (sort === 'wear-asc') items.sort((a,b)=>(a.attributes?.paint_wear||99)-(b.attributes?.paint_wear||99));
    if (sort === 'wear-desc') items.sort((a,b)=>(b.attributes?.paint_wear||0)-(a.attributes?.paint_wear||0));
    document.getElementById('itemGrid').innerHTML = items.map(i => renderItemCard(i)).join('');
  }
  document.querySelectorAll('#itemGrid .item-card').forEach((card, index) =>
    card.style.setProperty('--item-index', index)
  );
  prepareInventoryImageLoading();
}

// --- Stacked card ---
function renderStackedCard(representative, groupItems) {
  const wearName = (representative.tags||[]).find(t=>t.category==='Exterior')?.localized_tag_name || '';
  const wearColor = getWearColor(wearName);
  const rarityName = representative.rarity || '';
  const rarityColor = getRarityColor(rarityName);
  const isST = (representative.tags||[]).some(t=>t.category==='Quality'&&t.internal_name==='strange') || representative.market_hash_name?.includes('StatTrak');
  const count = groupItems.length;
  // Wear range
  const wears = groupItems.map(i=>i.attributes?.paint_wear).filter(w=>w!=null);
  let wearStr = wearName;
  if (wears.length > 0) {
    const min = Math.min(...wears).toFixed(4);
    const max = Math.max(...wears).toFixed(4);
    wearStr = wears.length === 1 ? min : `${min} ~ ${max}`;
  }
  // 安全嵌入：asset_id 列表序列化为可安全放进属性内的 JSON（见 jsonAttr），
  // 名称不再嵌入 onclick，改由 showStackedDetail 从库存中反查，消除名称注入面。
  const safeJson = jsonAttr(groupItems.map(i=>i.asset_id));
  const displayName = representative.name_zh || representative.market_hash_name;
  return `<div class="item-card" onclick="showStackedDetail(${safeJson})">
    <div class="item-wear-bar" style="background:${wearColor}"></div>
    ${isST?'<div class="item-st-badge">ST</div>':''}
    ${count>1?`<div class="item-count-badge">×${count}</div>`:''}
    <div class="item-img-box"><img data-src="${esc(imgUrl(representative.icon_url))}" alt="${esc(displayName)}" decoding="async" fetchpriority="low"></div>
    <div class="item-info">
      <div class="item-name" title="${esc(representative.market_hash_name)}">${esc(displayName)}</div>
      <div class="item-bottom">
        <span class="item-wear-text">${esc(wearStr)}</span>
        <span class="item-rarity" style="background:${rarityColor}22;color:${rarityColor}">${esc(rarityName)}</span>
      </div>
    </div></div>`;
}

// --- 从输入中提取 Steam ID ---
function extractSteamId(raw) {
  raw = raw.trim();
  if (!raw) return '';
  // 纯数字 17 位，且以 7656119 开头
  if (/^\d{17}$/.test(raw)) return raw.startsWith('7656119') ? raw : '';
  // profiles URL
  let m = raw.match(/steamcommunity\.com\/profiles\/(\d{17})/);
  if (m) return m[1];
  // 提取文本中的 17 位数字
  m = raw.match(/(\d{17})/);
  if (m) return m[1];
  return '';
}

// 实时校验输入框
function validateSteamIdInput() {
  const input = document.getElementById('modalSteamId');
  const hint = document.getElementById('steamIdHint');
  if (!input || !hint) return;
  const raw = input.value.trim();
  if (!raw) {
    hint.textContent = '支持: 17位数字ID / steamcommunity.com/profiles/xxx';
    hint.style.color = 'var(--text3)';
    input.style.borderColor = 'var(--border)';
    return;
  }
  const sid = extractSteamId(raw);
  if (sid) {
    if (sid !== raw) {
      hint.textContent = '已提取 ID: ' + sid;
    } else {
      hint.textContent = '有效的 Steam ID';
    }
    hint.style.color = 'var(--green)';
    input.style.borderColor = 'var(--green)';
  } else if (/steamcommunity\.com\/id\//.test(raw)) {
    hint.textContent = '自定义短链接暂不支持，请使用 profiles/xxx 格式';
    hint.style.color = 'var(--red)';
    input.style.borderColor = 'var(--red)';
  } else {
    hint.textContent = '无效：需 17 位数字 (7656119xxxx) 或 profiles 链接';
    hint.style.color = 'var(--red)';
    input.style.borderColor = 'var(--red)';
  }
}

async function saveUser() {
  const rawInput=document.getElementById('modalSteamId').value;
  const sid=extractSteamId(rawInput), nick=document.getElementById('modalNickname').value.trim();
  if(!sid){
    if(rawInput.trim()) toast('无效的 Steam ID：需 17 位数字且以 7656119 开头');
    else toast('请输入 Steam ID');
    return;
  }
  document.getElementById('modalSteamId').value = sid;
  if(editingSteamId){
    if(sid !== editingSteamId){
      // Steam ID 变了 → 新建 + 旧的移入回收站
      await api('POST','/api/users',{steam_id:sid, nickname:nick});
      await api('DELETE',`/api/users/${editingSteamId}`);
      toast(`已创建 ${sid}，旧用户已移入回收站`);
    } else {
      await api('PUT',`/api/users/${editingSteamId}`,{nickname:nick});
      toast('已更新');
    }
  }
  else{const r=await api('POST','/api/users',{steam_id:sid,nickname:nick});if(r.error){toast(r.error);return;}toast('已添加');}
  document.getElementById('addModal').style.display='none'; await loadUsers();
}
async function toggleUserActive(sid) { const users=await api('GET','/api/users'); const u=users.find(x=>x.steam_id===sid); if(!u)return; await api('PUT',`/api/users/${sid}`,{is_active:!u.is_active}); toast(u.is_active?'已停用':'已启用'); await loadUsers(); if(currentSteamId===sid) await loadInventory(sid); }

// --- 数据导出 / 导入 ---
async function doExport() {
  try {
    const r = await api('POST', '/api/export');
    if (r.ok) {
      toast(`已导出 ${r.user_count} 个用户 → ${r.filepath}`);
      const a = document.createElement('a');
      a.href = `/api/export/download?file=${encodeURIComponent(r.filename)}`;
      a.download = r.filename;
      a.click();
    } else {
      toast(r.error || '导出失败');
    }
  } catch(e) {
    toast('导出请求失败');
  }
}

async function doImport(input) {
  const file = input.files[0];
  if (!file) return;
  if (!file.name.endsWith('.cs2mon')) {
    toast('仅支持 .cs2mon 文件');
    input.value = '';
    return;
  }
  const form = new FormData();
  form.append('file', file);
  try {
    const resp = await fetch('/api/import', {
      method: 'POST',
      body: form,
    });
    const r = await resp.json();
    if (r.ok) {
      toast(`导入完成: 新建 ${r.stats.created}, 更新 ${r.stats.updated}`);
      await loadUsers();
      showManagePanel();
    } else {
      toast(r.error || '导入失败');
    }
  } catch(e) {
    toast('导入请求失败');
  }
  input.value = '';
}

// --- 频率管理 ---
async function setUserFrequency(sid, freq) {
  const prevVal = freq; // store the new value
  try {
    const r = await api('POST', `/api/users/${sid}/frequency`, {frequency: freq});
    if (r.ok) {
      toast(`频率已切换为 ${({'high':'⚡ 高频','medium':'🕐 中频','low':'💤 低频'})[freq]}`);
      await loadUsers();
      // 刷新管理面板中的频率状态
      setTimeout(showManagePanel, 200);
    } else {
      toast(r.error || '设置失败');
      // 回弹 UI：重新渲染管理面板
      setTimeout(showManagePanel, 200);
    }
  } catch(e) {
    toast('请求失败，请重试');
    setTimeout(showManagePanel, 200);
  }
}

          <col style="width:80px">
          <col style="width:65px">
          <col style="width:140px">
        </colgroup>
        <thead><tr><th>昵称</th><th>Steam ID</th><th>状态</th><th>库存</th><th>频率</th><th>操作</th></tr></thead>
        <tbody>`;

  if (!users.length) {
    html += '<tr><td colspan="6" style="text-align:center;color:var(--text3);padding:24px">暂无监控用户，点击右上角"添加用户"</td></tr>';
  }
  for (const u of users) {
    const statusBadge = u.is_active
      ? (u.consecutive_fails > 0 ? `<span class="badge badge-fail" style="font-size:11px;padding:2px 6px">失败×${u.consecutive_fails}</span>`
        : (u.item_count > 0 ? `<span class="badge badge-ok" style="font-size:11px;padding:2px 6px">正常</span>` : `<span class="badge" style="background:rgba(253,203,110,0.15);color:var(--orange);font-size:11px;padding:2px 6px">待抓取</span>`))
      : '<span class="badge badge-off" style="font-size:11px;padding:2px 6px">已停用</span>';
    const failHint = u.last_error_msg ? `<div style="font-size:11px;color:var(--red);margin-top:2px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(u.last_error_msg)}">${esc(u.last_error_msg)}</div>` : '';
    const freq = u.monitor_frequency || 'medium';
    const freqLabels = {high: '⚡', medium: '🕐', low: '💤'};
    const freqTitles = {high: '高频 5min', medium: '中频 10min', low: '低频 20min'};
    const freqSelect = `<select class="freq-select" onchange="setUserFrequency(${jsonAttr(u.steam_id)}, this.value); this.blur()" onclick="event.stopPropagation()" title="${esc(freqTitles[freq])}">
      <option value="high" ${freq==='high'?'selected':''}>⚡ 高</option>
      <option value="medium" ${freq==='medium'?'selected':''}>🕐 中</option>
      <option value="low" ${freq==='low'?'selected':''}>💤 低</option>
    </select>`;
    html += `<tr>
      <td style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><strong>${esc(u.nickname||'—')}</strong>${failHint}</td>
      <td style="font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(u.steam_id)}">${esc(u.steam_id)}</td>
      <td>${statusBadge}</td>
      <td style="font-size:12px">${u.item_count} / ${u.api_total_count}</td>
      <td>${freqSelect}</td>
      <td class="manage-action-cell">
        <div class="manage-action-buttons">
          <button class="btn btn-sm btn-ghost" title="编辑备注" onclick="editUser(${jsonAttr(u.steam_id)});showManagePanel()">✏️</button>
          <button class="btn btn-sm btn-ghost" title="${u.is_active?'停用':'启用'}" onclick="toggleUserActive(${jsonAttr(u.steam_id)});setTimeout(showManagePanel,300)">${u.is_active?'⏸':'▶'}</button>
          <button class="btn btn-sm btn-ghost" style="color:var(--red)" title="移入回收站" onclick="deleteUser(${jsonAttr(u.steam_id)});setTimeout(showManagePanel,300)">🗑️</button>
        </div>
      </td>
    </tr>`;
  }
  html += '</tbody></table></div></div></div>';

  // 频率管理面板
  html += `<div class="freq-panel" id="freqPanel">
    <h3>📊 分层调度概览</h3>
    <div id="freqPanelContent" style="text-align:center;padding:12px;color:var(--text3)">加载中...</div>
  </div>`;

  // 回收站
  if (trash.length) {
    html += `<div class="panel" style="margin-top:16px">
      <div class="panel-header"><h2>🗑️ 回收站</h2><span style="font-size:12px;color:var(--text3)">${trash.length} 个用户</span></div>
      <div class="panel-body" style="padding:0">
        <table class="inv-table">
          <thead><tr><th>昵称</th><th>Steam ID</th><th>库存</th><th>删除时间</th><th>操作</th></tr></thead>
          <tbody>`;
    for (const u of trash) {
      html += `<tr>
        <td><strong>${esc(u.nickname||'—')}</strong></td>
        <td style="font-size:12px;color:var(--text3)">${esc(u.steam_id)}</td>
        <td>${u.item_count} 件</td>
        <td style="font-size:12px;color:var(--text3)">${u.deleted_at?new Date(u.deleted_at).toLocaleString():'—'}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-sm btn-success" onclick="restoreUser(${jsonAttr(u.steam_id)});setTimeout(showManagePanel,300)">恢复</button>
          <button class="btn btn-sm btn-danger" onclick="permanentDeleteUser(${jsonAttr(u.steam_id)});setTimeout(showManagePanel,300)">永久删除</button>
        </td>
      </tr>`;
    }
    html += '</tbody></table></div></div>';
  }

  if (!isCurrentView(request)) return;
  c.innerHTML = html;
  // 异步加载频率面板
  loadFreqPanel(request.version);
}

// --- 频率面板 ---
async function loadFreqPanel(viewVersion = viewRequestVersion) {
  const el = document.getElementById('freqPanelContent');
  if (!el) return;
  try {
    const fs = await api('GET', '/api/frequency/status');
    if (viewVersion !== viewRequestVersion) return;
    const labels = {high: '⚡ 高频', medium: '🕐 中频', low: '💤 低频'};
    let html = '';
    for (const [tier, label] of Object.entries(labels)) {
      const count = fs.tier_user_counts?.[tier] || 0;
      const interval = fs.intervals?.[tier] || '—';
      const lastRun = fs.last_runs?.[tier] || '';
      const lastTime = lastRun ? new Date(lastRun).toLocaleTimeString() : '—';
      html += `<div class="freq-tier-row">
        <span class="freq-tier-name">${label}</span>
        <span class="freq-tier-count">${count}人</span>
        <span style="color:var(--text3);font-size:11px">间隔 ${interval}分钟</span>
        <span class="freq-tier-last">上次: ${lastTime}</span>
      </div>`;
    }
    if (!fs.enabled) {
      html += '<div style="margin-top:8px;font-size:11px;color:var(--text3);text-align:center">⚠️ 分层调度未启用，当前使用统一间隔模式</div>';
    }
    el.innerHTML = html;
  } catch(e) {
    if (viewVersion === viewRequestVersion && !isAbortError(e)) el.innerHTML = '<span style="color:var(--red)">加载失败</span>';
  }
}
async function deleteUser(sid) {
  if(!confirm(`确定将 ${sid} 移入回收站？\n数据会被保留，可随时恢复。`)) return;
  const r = await api('DELETE', `/api/users/${sid}`);
  toast(r.msg || '已移入回收站');
  if (currentSteamId === sid) {
    currentSteamId = null;
    document.getElementById('content').innerHTML = '<div class="empty"><div class="icon">👈</div><p>选择左侧用户</p></div>';
  }
  await loadUsers();
}

// --- 回收站 ---
async function showTrash() {
  const c = document.getElementById('content');
  const request = beginViewRequest();
  c.innerHTML = '<div style="padding:20px;text-align:center"><div class="spinner"></div></div>';
  let trash;
  try { trash = await api('GET', '/api/trash', undefined, { signal: request.controller.signal }); }
  catch (error) {
    if (!isAbortError(error) && isCurrentView(request)) showViewError(c, error, 'showTrash()');
    return;
  }
  if (!isCurrentView(request)) return;
  if (!trash.length) {
    c.innerHTML = '<div class="empty"><div class="icon">🗑️</div><p>回收站为空</p></div>';
    return;
  }
  c.innerHTML = `<div class="panel"><div class="panel-header"><h2>🗑️ 回收站</h2><span style="font-size:12px;color:var(--text3)">${trash.length} 个用户</span></div><div class="panel-body" style="padding:0">
    <table class="inv-table"><thead><tr><th>用户</th><th>Steam ID</th><th>库存</th><th>删除时间</th><th>操作</th></tr></thead><tbody>
    ${trash.map(u => `<tr>
      <td><strong>${esc(u.nickname||'—')}</strong></td>
      <td style="font-size:12px;color:var(--text3)">${esc(u.steam_id)}</td>
      <td>${u.item_count} 件</td>
      <td style="font-size:12px;color:var(--text3)">${u.deleted_at ? new Date(u.deleted_at).toLocaleString() : '—'}</td>
      <td>
        <button class="btn btn-sm btn-success" onclick="restoreUser(${jsonAttr(u.steam_id)})">恢复</button>
        <button class="btn btn-sm btn-danger" onclick="permanentDeleteUser(${jsonAttr(u.steam_id)})">永久删除</button>
      </td>
    </tr>`).join('')}
    </tbody></table></div></div>`;
}

async function restoreUser(sid) {
  const r = await api('POST', `/api/users/${sid}/restore`);
  toast(r.msg || '已恢复');
  await loadUsers();
  await showTrash();
}

async function permanentDeleteUser(sid) {
  if(!confirm(`⚠️ 永久删除 ${sid}？\n所有库存数据、历史快照、变化记录将被彻底清除，不可恢复！`)) return;
  if(!confirm('再次确认：真的要永久删除吗？')) return;
  const r = await api('DELETE', `/api/users/${sid}/permanent`);
  toast(r.msg || '已永久删除');
  await showTrash();
}

// --- Monitor control ---
async function toggleMonitor() { const s=await api('GET','/api/status'); if(s.monitor_running){await api('POST','/api/monitor/stop');toast('已停止');}else{await api('POST','/api/monitor/start');toast('已启动');} await refreshStatus(); }
async function fetchNow() { const btn=document.getElementById('btnFetchNow'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span>'; try{const r=await api('POST','/api/monitor/fetch-now'); toast(r.ok?`完成: 成功${r.stats?.success||0} 失败${r.stats?.fail||0}`:'失败');}catch(e){toast('请求失败');} btn.disabled=false; btn.innerHTML='⟳ 立即爬取'; await loadUsers(); if(currentSteamId) await loadInventory(currentSteamId); await refreshStatus(); }

function switchTab(el, id) { el.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active'); el.closest('.panel').querySelectorAll('.panel-body[id$="Tab"]').forEach(p=>p.style.display='none'); document.getElementById(id).style.display=''; if(id==='archiveTab') void loadArchives(currentSteamId); }
function toggleChanges() {
  const extras = document.querySelectorAll('.change-extra');
  const btn = document.querySelector('#changeExpand .btn');
  if (!extras.length || !btn) return;
  const hidden = extras[0].style.display === 'none';
  extras.forEach(el => el.style.display = hidden ? '' : 'none');
  btn.textContent = hidden ? '收起' : `展开全部 (${document.querySelectorAll('.change-item').length} 条)`;
}
async function loadArchives(sid) {
  const requestVersion = viewRequestVersion;
  const el = document.getElementById('archiveTab');
  if (!el || requestVersion !== viewRequestVersion || currentSteamId !== sid) return;
  let a, sched;
  try {
    [a, sched] = await Promise.all([
      api('GET', `/api/users/${sid}/archives`),
      api('GET', '/api/schedule'),
    ]);
  } catch (error) {
    if (!isAbortError(error) && requestVersion === viewRequestVersion && currentSteamId === sid) {
      showViewError(el, error, `loadArchives(${jsonAttr(sid)})`);
    }
    return;
  }
  if (requestVersion !== viewRequestVersion || currentSteamId !== sid) return;

  // 创建快照按钮 + 调度设置
  const hourOpts = Array.from({length:24}, (_,i) => `<option value="${i}" ${sched.snapshot_hour===i?'selected':''}>${String(i).padStart(2,'0')}:00</option>`).join('');
  const intervalOpts = [
    [0,'每日定时'], [1,'每1小时'], [2,'每2小时'], [3,'每3小时'],
    [4,'每4小时'], [6,'每6小时'], [8,'每8小时'], [12,'每12小时'],
  ].map(([v,l]) => `<option value="${v}" ${sched.snapshot_interval_hours===v?'selected':''}>${l}</option>`).join('');

  const schedulePanel = `
    <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:16px">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px">⏱️ 自动归档设置</div>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <label style="font-size:12px;color:var(--text2)">频率:
          <select id="schedInterval" onchange="updateSchedUI()" style="padding:4px;background:var(--card);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px">${intervalOpts}</select>
        </label>
        <label style="font-size:12px;color:var(--text2)" id="schedHourLabel">时间:
          <select id="schedHour" style="padding:4px;background:var(--card);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px">${hourOpts}</select>
        </label>
        <label style="font-size:12px;color:var(--text2)">监控间隔:
          <select id="schedFetchMin" style="padding:4px;background:var(--card);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px">
            ${[1,2,3,5,10,15,30,60].map(m => `<option value="${m}" ${sched.fetch_interval_minutes===m?'selected':''}>${m}分钟</option>`).join('')}
          </select>
        </label>
        <button class="btn btn-sm btn-primary" onclick="saveSchedule()">保存</button>
        <span id="schedMsg" style="font-size:12px;color:var(--text3)"></span>
      </div>
    </div>`;

  const createBtn = `<div style="margin-bottom:12px"><button class="btn btn-sm btn-primary" onclick="createSnapshot('${sid}')">📸 创建当前快照</button> <span id="snapshotMsg" style="font-size:12px;color:var(--text3);margin-left:8px"></span></div>`;

  if (!a.length) {
    el.innerHTML = schedulePanel + createBtn + '<div style="color:var(--text3);text-align:center">暂无历史快照，点击上方按钮创建第一条</div>';
    updateSchedUI();
    return;
  }

  const opts = a.map(x=>`<option value="${x.id}">${x.date} (${x.item_count}件)</option>`).join('');
  el.innerHTML = schedulePanel + createBtn + `
    <div style="margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <select id="compareA" style="padding:6px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px">${opts}</select>
      <span style="color:var(--text3)">vs</span>
      <select id="compareB" style="padding:6px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px">
        ${a.length>1?`<option value="${a[1].id}" selected>${a[1].date} (${a[1].item_count}件)</option>`:''}${opts}
      </select>
      <button class="btn btn-sm btn-primary" onclick="runCompare('${sid}')">对比</button>
    </div>
    <div id="compareResult"></div>
    <div style="margin-top:16px">
      ${a.map(x=>`<div style="padding:10px 0;border-bottom:1px solid var(--border)"><div style="font-size:12px;color:var(--accent)">📅 ${x.date} · ${x.item_count}件</div><div style="font-size:13px;color:var(--text2)">${x.top_items.map(t=>esc(t.name)+'×'+t.count).join(', ')}</div></div>`).join('')}
    </div>`;
  updateSchedUI();
}

function updateSchedUI() {
  const interval = parseInt(document.getElementById('schedInterval')?.value || '0');
  const hourLabel = document.getElementById('schedHourLabel');
  if (hourLabel) hourLabel.style.display = interval > 0 ? 'none' : '';
}

async function saveSchedule() {
  const interval = parseInt(document.getElementById('schedInterval').value);
  const hour = parseInt(document.getElementById('schedHour').value);
  const fetchMin = parseInt(document.getElementById('schedFetchMin').value);
  const msg = document.getElementById('schedMsg');
  try {
    const r = await api('PUT', '/api/schedule', {
      snapshot_hour: hour,
      snapshot_interval_hours: interval,
      fetch_interval_minutes: fetchMin,
    });
    if (r.ok) {
      const desc = interval > 0 ? `每${interval}小时` : `每日 ${String(hour).padStart(2,'0')}:00`;
      msg.textContent = `已保存: ${desc}, 监控间隔${fetchMin}分钟`;
      toast('调度设置已更新');
    } else {
      msg.textContent = '保存失败';
    }
  } catch(e) {
    msg.textContent = '请求失败';
  }
}

async function createSnapshot(sid) {
  const msg = document.getElementById('snapshotMsg');
  if (msg) msg.textContent = '创建中...';
  try {
    const r = await api('POST', `/api/users/${sid}/snapshot`);
    if (r.ok) {
      if (msg) msg.textContent = r.msg;
      toast(r.msg);
      void loadArchives(sid);  // 刷新列表
    } else {
      if (msg) msg.textContent = r.error || '失败';
      toast(r.error || '创建失败');
    }
  } catch(e) {
    if (msg) msg.textContent = '请求失败';
  }
}

// --- 批量导入 ---
function showBatchImport() {
  document.getElementById('batchInput').value = '';
  document.getElementById('batchResult').style.display = 'none';
  document.getElementById('batchResult').innerHTML = '';
  document.getElementById('btnBatchImport').disabled = false;
  document.getElementById('batchModal').style.display = '';
  document.getElementById('batchInput').focus();
}

async function doBatchImport() {
  const text = document.getElementById('batchInput').value.trim();
  if (!text) { toast('请输入内容'); return; }
  const btn = document.getElementById('btnBatchImport');
  btn.disabled = true;
  btn.textContent = '导入中...';
  try {
    const r = await api('POST', '/api/users/batch', {text});
    const el = document.getElementById('batchResult');
    el.style.display = '';
    if (r.ok) {
      let html = `<div style="font-size:13px;margin-bottom:8px">共 ${r.total} 条：✅ 成功 ${r.success}，❌ 失败 ${r.fail}</div>`;
      html += '<table class="inv-table" style="font-size:12px"><thead><tr><th>#</th><th>输入</th><th>Steam ID</th><th>备注</th><th>结果</th></tr></thead><tbody>';
      for (const item of r.results) {
        const status = item.ok
          ? `<span style="color:var(--green)">${esc(item.msg||'OK')}</span>`
          : `<span style="color:var(--red)">${esc(item.error)}</span>`;
        html += `<tr>
          <td>${item.line}</td>
          <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(item.input)}">${esc(item.input)}</td>
          <td style="font-size:11px">${esc(item.steam_id||'—')}</td>
          <td>${esc(item.nickname||'—')}</td>
          <td>${status}</td>
        </tr>`;
      }
      html += '</tbody></table>';
      el.innerHTML = html;
      if (r.success > 0) {
        toast(`已导入 ${r.success} 个用户`);
        loadUsers();
      }
    } else {
      el.innerHTML = `<div style="color:var(--red)">${esc(r.error)}</div>`;
    }
  } catch(e) {
    toast('请求失败');
  }
  btn.disabled = false;
  btn.textContent = '导入';
}

async function runCompare(sid) {
  const idA = document.getElementById('compareA').value;
  const idB = document.getElementById('compareB').value;
  if (idA === idB) { toast('请选择两个不同的快照'); return; }
  const el = document.getElementById('compareResult');
  el.innerHTML = '<div style="text-align:center;padding:10px"><div class="spinner"></div></div>';
  let d;
  try {
    d = await api('GET', `/api/users/${sid}/compare?a=${idA}&b=${idB}`);
  } catch (error) {
    if (!isAbortError(error)) {
      el.innerHTML = `<div style="color:var(--red);text-align:center">对比加载失败，请重试 <button class="btn btn-sm btn-ghost" onclick="runCompare(${jsonAttr(sid)})">重试</button></div>`;
    }
    return;
  }
  if (d.error) { el.innerHTML = '<div style="color:var(--red)">'+esc(d.error)+'</div>'; return; }
  if (!d.diff.length) { el.innerHTML = '<div style="color:var(--text3);text-align:center">两次快照无差异</div>'; return; }
  const fmtDate = s => s ? s.replace(/(\d{2})(\d{2})(\d{2})(\d{2})/, '$1年$2月$3日$4时') : '';
  el.innerHTML = '<div style="font-size:13px;margin-bottom:8px;color:var(--text2)">📅 '+fmtDate(d.date_a)+'（'+d.count_a+'件）→ '+fmtDate(d.date_b)+'（'+d.count_b+'件）</div>'
    +'<table class="inv-table"><thead><tr><th>物品名称</th><th>快照A数量</th><th>快照B数量</th><th>变化量</th></tr></thead><tbody>'
    +d.diff.map(function(i){ var c=i.delta>0?'var(--green)':'var(--red)'; var label=i.delta>0?'增加':'减少'; return '<tr><td>'+esc(i.name)+'</td><td>'+i.count_a+'</td><td>'+i.count_b+'</td><td style="color:'+c+';font-weight:700">'+label+' '+Math.abs(i.delta)+'</td></tr>'; }).join('')
    +'</tbody></table>';
}

// --- Init ---
async function init() {
  // 检查认证
  const ok = await checkAuth();
  if (!ok) { showLogin(); return; }
  stopLiveUpdates();
  let s;
  try {
    [s] = await Promise.all([refreshStatus(), loadUsers()]);
  } catch (error) {
    if (!isAbortError(error) && error?.status !== 401) showViewError(document.getElementById('content'), error, 'init()');
    return;
  }
  startLiveUpdates();
  if (!s.monitor_running) { await api('POST','/api/monitor/start'); toast('监控已自动启动'); await refreshStatus(); }
}
init().catch(error => {
  if (!isAbortError(error) && error?.status !== 401) showViewError(document.getElementById('content'), error, 'init()');
});
</script>
</body>
</html>
